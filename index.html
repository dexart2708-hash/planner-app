<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Планер — Мои задачи</title>

  <script>
    (function() {
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #fefafc; --bg-2: #fdf2f8;
      --surface: rgba(255,255,255,0.92); --surface-solid: #ffffff;
      --surface-alt: #fef7fb; --surface-hover: #fdf2f8;
      --header-bg: rgba(255,255,255,0.78);
      --border: #fce7f3; --border-strong: #fbcfe8;
      --card-border: rgba(252,231,243,0.9);
      --text: #1f1420; --text-muted: #7c6a75; --text-subtle: #b09aa6;
      --accent-soft: #fce7f3;
      --pink: #ec4899; --pink-dark: #db2777; --pink-light: #f472b6;
      --pink-soft: rgba(236,72,153,0.08); --pink-border: rgba(236,72,153,0.3); --pink-text: #be185d;
      --high: #e11d48; --high-soft: rgba(225,29,72,0.08); --high-border: #fecdd3;
      --medium: #f59e0b; --medium-soft: rgba(245,158,11,0.08); --medium-border: #fde68a;
      --low: #059669; --low-soft: rgba(5,150,105,0.06); --low-border: #a7f3d0;
      --blue: #3b82f6; --blue-soft: #eff6ff; --blue-border: #bfdbfe;
      --shadow-xs: 0 1px 2px rgba(219,39,119,0.04);
      --shadow-sm: 0 1px 3px rgba(219,39,119,0.06), 0 1px 2px rgba(219,39,119,0.04);
      --shadow-md: 0 4px 6px -1px rgba(219,39,119,0.08), 0 2px 4px -1px rgba(219,39,119,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(219,39,119,0.1), 0 4px 6px -2px rgba(219,39,119,0.05);
      --shadow-xl: 0 20px 25px -5px rgba(219,39,119,0.12), 0 10px 10px -5px rgba(219,39,119,0.05);
      --shadow-toast: 0 20px 25px -5px rgba(219,39,119,0.15), 0 8px 10px -6px rgba(219,39,119,0.1);
      --bg-opacity: 0.05;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg-1: #1a0f18; --bg-2: #231526;
      --surface: rgba(50,30,48,0.75); --surface-solid: #2e1c2d;
      --surface-alt: #2e1c2d; --surface-hover: #3a2438;
      --header-bg: rgba(50,30,48,0.65);
      --border: rgba(244,114,182,0.15); --border-strong: rgba(244,114,182,0.28);
      --card-border: rgba(244,114,182,0.1);
      --text: #fbe8f3; --text-muted: #d0a8bd; --text-subtle: #9b7a8e;
      --accent-soft: rgba(244,114,182,0.12);
      --pink: #f472b6; --pink-dark: #ec4899; --pink-light: #f9a8d4;
      --pink-soft: rgba(244,114,182,0.12); --pink-border: rgba(244,114,182,0.35); --pink-text: #fbcfe8;
      --high: #fb7185; --high-soft: rgba(225,29,72,0.18); --high-border: rgba(251,113,133,0.4);
      --medium: #fbbf24; --medium-soft: rgba(245,158,11,0.15); --medium-border: rgba(251,191,36,0.35);
      --low: #34d399; --low-soft: rgba(5,150,105,0.15); --low-border: rgba(52,211,153,0.35);
      --blue: #60a5fa; --blue-soft: rgba(59,130,246,0.15); --blue-border: rgba(96,165,250,0.35);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -1px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.55), 0 4px 6px -2px rgba(0,0,0,0.35);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.6), 0 10px 10px -5px rgba(0,0,0,0.4);
      --shadow-toast: 0 20px 25px -5px rgba(0,0,0,0.6), 0 8px 10px -6px rgba(0,0,0,0.5);
      --bg-opacity: 0.08;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font); color: var(--text);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv02','cv03','cv04','cv11','tnum';
      line-height: 1.5; min-height: 100vh;
      transition: background-color var(--transition), color var(--transition);
      overflow-x: hidden;
    }
    body {
      background:
        radial-gradient(ellipse at top left, rgba(236,72,153,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(244,114,182,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at top right, rgba(168,85,247,0.05) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      padding: 32px 24px;
      padding-top: calc(32px + env(safe-area-inset-top));
      padding-right: calc(24px + env(safe-area-inset-right));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      padding-left: calc(24px + env(safe-area-inset-left));
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='340'%20height='340'%20viewBox='0%200%20340%20340'%3E%3Cg%20fill='%23ec4899'%20font-family='Georgia,serif'%20font-weight='700'%3E%3Ctext%20x='35'%20y='75'%20font-size='48'%20transform='rotate(-12%2035%2075)'%3E%E2%99%A1%3C/text%3E%3Ctext%20x='230'%20y='55'%20font-size='42'%20transform='rotate(15%20230%2055)'%3E%E2%9C%A6%3C/text%3E%3Ctext%20x='100'%20y='190'%20font-size='44'%20transform='rotate(-8%20100%20190)'%3E%E2%9D%80%3C/text%3E%3Ctext%20x='270'%20y='210'%20font-size='40'%20transform='rotate(10%20270%20210)'%3E%E2%9C%BF%3C/text%3E%3Ctext%20x='50'%20y='310'%20font-size='42'%20transform='rotate(20%2050%20310)'%3E%E2%9C%A7%3C/text%3E%3Ctext%20x='230'%20y='325'%20font-size='38'%20transform='rotate(-15%20230%20325)'%3E%E2%9C%B8%3C/text%3E%3C/g%3E%3C/svg%3E");
      background-repeat: repeat; background-size: 340px 340px;
      opacity: var(--bg-opacity);
    }
    [data-theme="dark"] body::before { filter: brightness(1.4); }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.3) 100%);
    }
    [data-theme="dark"] body::after { opacity: 0; }
    .container { max-width: 1600px; margin: 0 auto; position: relative; z-index: 1; }

    .theme-toggle {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md); transition: all var(--transition);
      padding: 0; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .theme-toggle:hover { transform: scale(1.08) rotate(12deg); box-shadow: var(--shadow-lg); }
    .theme-toggle svg { position: absolute; width: 20px; height: 20px; transition: all var(--transition); }
    .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); color: #f59e0b; }
    .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); color: var(--pink); }
    [data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    [data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding: 16px 22px;
      background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 16px;
      box-shadow: var(--shadow-sm);
    }
    .page-title {
      font-size: 1.375rem; font-weight: 700; letter-spacing: -0.025em;
      background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    [data-theme="dark"] .page-title {
      background: linear-gradient(135deg, #f9a8d4 0%, #f472b6 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .page-subtitle { font-size: 0.8125rem; color: var(--text-muted); margin-top: 2px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--surface-solid); box-shadow: var(--shadow-sm);
      background-color: var(--surface-alt); flex-shrink: 0;
    }
    .user-name-wrap { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
    .user-name {
      font-size: 0.875rem; font-weight: 600;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      white-space: nowrap;
    }
    .user-role {
      font-size: 0.625rem; font-weight: 500; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes weekInFromRight {
      from { opacity: 0; transform: translateX(48px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes weekInFromLeft {
      from { opacity: 0; transform: translateX(-48px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .week-view.animate-right { animation: weekInFromRight 0.4s cubic-bezier(0.16,1,0.3,1); }
    .week-view.animate-left { animation: weekInFromLeft 0.4s cubic-bezier(0.16,1,0.3,1); }

    .card {
      background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow-sm);
      animation: fadeInUp var(--transition) both;
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .card-title { font-size: 0.9375rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .card-title::before {
      content: ''; width: 3px; height: 16px;
      background: linear-gradient(180deg, #db2777 0%, #f472b6 100%);
      border-radius: 2px;
    }

    .progress-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px; align-items: center; margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; }
    .progress-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .progress-value { font-size: 1.375rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
    .progress-value span { font-size: 0.8125rem; font-weight: 500; color: var(--text-muted); }
    .progress-bar {
      width: 100%; height: 8px; background: var(--surface-alt);
      border-radius: 999px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #db2777 0%, #f472b6 100%);
      border-radius: 999px; transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .progress-stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .progress-stat { display: flex; flex-direction: column; gap: 1px; }
    .progress-stat-label { font-size: 0.625rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .progress-stat-value { font-size: 1rem; font-weight: 700; color: var(--text); }
    .progress-stat-value.high { color: var(--high); }
    .progress-stat-value.medium { color: var(--medium); }
    .progress-stat-value.low { color: var(--low); }

    .controls-card { padding: 16px 20px; }
    .controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .week-nav { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .week-nav button {
      width: 36px; height: 36px; padding: 0; min-height: auto;
      background: var(--surface-solid); color: var(--pink);
      border: 1px solid var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: none; transition: all var(--transition-fast);
    }
    .week-nav button:hover {
      background: var(--pink-soft); color: var(--pink-dark);
      border-color: var(--pink-border); filter: none; transform: none;
    }
    .week-nav .today-btn {
      width: auto; padding: 0 14px; font-size: 0.75rem; font-weight: 600;
      min-height: 36px;
    }
    .week-label {
      font-size: 0.875rem; font-weight: 700; color: var(--text);
      padding: 0 10px; min-width: 160px; text-align: center;
    }
    .search-wrap { position: relative; display: flex; align-items: center; flex: 1; min-width: 180px; }
    .search-icon { position: absolute; left: 12px; width: 14px; height: 14px; color: var(--pink); pointer-events: none; z-index: 1; }
    .search-input { padding-left: 34px; padding-right: 36px; min-height: 36px; font-size: 0.8125rem; background: var(--surface-alt); }
    .search-input:focus { background: var(--surface-solid); }
    .search-clear {
      position: absolute; right: 6px; width: 26px; height: 26px; padding: 0; min-height: auto;
      background: transparent; color: var(--text-muted); border: none; border-radius: 50%;
      font-size: 1.125rem; line-height: 1; display: none;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: none; font-weight: 400;
    }
    .search-clear.visible { display: flex; }
    .search-clear:hover { background: var(--pink-soft); color: var(--pink-dark); filter: none; transform: none; }

    .filter-select {
      min-height: 36px; padding: 8px 32px 8px 12px; font-size: 0.8125rem; width: auto; min-width: 140px;
      background-position: right 10px center;
    }

    .toggle-btn {
      padding: 8px 14px; min-height: 36px; font-size: 0.75rem;
      background: var(--surface-solid); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: none; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .toggle-btn:hover { background: var(--surface-hover); border-color: var(--pink-border); color: var(--pink-dark); filter: none; transform: none; }
    .toggle-btn.active {
      background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
      color: #fff; border-color: transparent;
      box-shadow: var(--shadow-sm);
    }
    .toggle-btn.active:hover { filter: brightness(1.06); color: #fff; transform: translateY(-1px); }

    .week-view {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .day-column {
      background: var(--surface);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 420px;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .day-column:hover { border-color: var(--pink-border); }
    .day-column.today {
      background: linear-gradient(180deg, rgba(236,72,153,0.07) 0%, var(--surface) 80%);
      border-color: var(--pink-border);
      box-shadow: var(--shadow-sm);
    }
    [data-theme="dark"] .day-column.today {
      background: linear-gradient(180deg, rgba(244,114,182,0.1) 0%, var(--surface) 80%);
    }

    .day-header {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 8px;
    }
    .day-header-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .day-name {
      font-size: 0.6875rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--pink-text);
    }
    [data-theme="dark"] .day-name { color: var(--pink); }
    .day-date {
      font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .day-count {
      font-size: 0.6875rem; font-weight: 700;
      padding: 3px 8px; border-radius: 6px;
      background: var(--accent-soft); color: var(--text-muted);
      white-space: nowrap;
    }
    .day-column.today .day-count {
      background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
      color: #fff;
    }

    .day-tasks {
      display: flex; flex-direction: column; gap: 8px;
      flex: 1; min-width: 0;
      min-height: 40px;
    }

    .task-card {
      background: var(--surface-solid);
      border-radius: 10px;
      padding: 10px 12px;
      border-left: 3px solid var(--border-strong);
      cursor: pointer;
      position: relative;
      transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease,
                  box-shadow 0.2s ease, transform 0.15s ease;
    }
    .task-card:hover { transform: translateX(2px); box-shadow: var(--shadow-sm); border-color: var(--pink-border); }
    .task-card.priority-high { border-left-color: var(--high); background: linear-gradient(180deg, var(--high-soft) 0%, var(--surface-solid) 100%); }
    .task-card.priority-medium { border-left-color: var(--medium); background: linear-gradient(180deg, var(--medium-soft) 0%, var(--surface-solid) 100%); }
    .task-card.priority-low { border-left-color: var(--low); background: linear-gradient(180deg, var(--low-soft) 0%, var(--surface-solid) 100%); }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-card-title { text-decoration: line-through; color: var(--text-muted); }
    .task-card.overdue { box-shadow: 0 0 0 1px var(--high-border) inset; }
    .task-card[draggable="true"] { cursor: grab; }
    .task-card.dragging { opacity: 0.35; cursor: grabbing; transform: scale(0.97); }
    .task-card.drag-over { box-shadow: 0 -3px 0 var(--pink) inset; }
    .day-column.drag-over-column {
      background: linear-gradient(180deg, rgba(236,72,153,0.1) 0%, var(--surface) 80%);
      border-color: var(--pink);
      border-style: dashed;
      box-shadow: var(--shadow-md);
    }
    [data-theme="dark"] .day-column.drag-over-column {
      background: linear-gradient(180deg, rgba(244,114,182,0.14) 0%, var(--surface) 80%);
    }

    .task-card-top {
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 6px;
    }
    .task-checkbox {
      width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
      border-radius: 5px; border: 2px solid var(--border-strong);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-fast);
      padding: 0; min-height: auto;
      box-shadow: none;
    }
    .task-checkbox:hover { border-color: var(--pink); transform: scale(1.1); filter: none; }
    .task-checkbox::after { display: none; }
    .task-checkbox svg { width: 11px; height: 11px; color: #fff; opacity: 0; transition: all var(--transition-fast); }
    .task-card.done .task-checkbox {
      background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
      border-color: transparent;
    }
    .task-card.done .task-checkbox svg { opacity: 1; }

    .task-card-title {
      font-size: 0.8125rem; font-weight: 600; color: var(--text);
      line-height: 1.35; flex: 1; min-width: 0;
      word-break: break-word;
    }

    .task-card-meta {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      font-size: 0.6875rem; font-weight: 600;
      padding-left: 26px;
    }
    .meta-pill {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 5px;
      background: var(--surface-alt); color: var(--text-muted);
    }
    .meta-pill.time { background: rgba(236,72,153,0.1); color: var(--pink-dark); }
    .meta-pill.category { background: var(--blue-soft); color: var(--blue); }

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  initializeFirestore,
  persistentLocalCache,
  persistentMultipleTabManager,
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  onSnapshot,
  serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDdm0kaIesCu4CBennxPVoPhXwyAyAiwIg",
  authDomain: "chek-listdb.firebaseapp.com",
  projectId: "chek-listdb",
  storageBucket: "chek-listdb.firebasestorage.app",
  messagingSenderId: "966580226421",
  appId: "1:966580226421:web:af59fd2a1ad92fd4b8eb3c"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const COLLECTION = 'planner_tasks';
const ARCHIVE_DAYS = 30;
const REMINDER_CHECK_INTERVAL = 60000;
console.log('[INIT] Планер (недельный вид + drag&drop)');

let allTasks = [];
let archivedTasks = [];
let unsubscribe = null;
let editingId = null;
let searchQuery = '';
let searchTimeout = null;
let priorityFilter = 'all';
let showDone = true;
let showArchive = false;
let currentWeekStart = getWeekStart(new Date());
let notifiedTaskIds = new Set(JSON.parse(localStorage.getItem('notified_task_ids') || '[]'));
let draggedTaskId = null;

function pad(n) { return String(n).padStart(2, '0'); }
function dateToStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getTodayStr() { return dateToStr(new Date()); }
function getWeekStart(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-message">${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

// ==================== НАПОМИНАНИЯ ====================
function updateNotifBanner() {
  const banner = document.getElementById('notifBanner');
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') banner.classList.add('visible');
  else banner.classList.remove('visible');
}

document.getElementById('notifBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) { showToast('Браузер не поддерживает уведомления', 'error'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    showToast('Уведомления включены!', 'success');
    updateNotifBanner();
    new Notification('Планер', { body: 'Напоминания включены' });
  }
});

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  allTasks.forEach(t => {
    if (t.done || !t.reminder || t.reminder === '') return;
    if (!t.date || !t.time) return;
    if (notifiedTaskIds.has(t.id)) return;
    const taskTime = new Date(`${t.date}T${t.time}:00`);
    if (isNaN(taskTime.getTime())) return;
    const reminderMin = Number(t.reminder);
    const reminderTime = new Date(taskTime.getTime() - reminderMin * 60000);
    const diff = now - reminderTime;
    if (diff >= 0 && diff < 10 * 60000) {
      try {
        new Notification('🔔 Напоминание', {
          body: t.title + (t.time ? ` в ${t.time}` : ''),
          tag: 'task-' + t.id
        });
        notifiedTaskIds.add(t.id);
        localStorage.setItem('notified_task_ids', JSON.stringify([...notifiedTaskIds]));
      } catch (e) {}
    }
  });
}
setInterval(checkReminders, REMINDER_CHECK_INTERVAL);

async function autoArchive() {
  const cutoff = Date.now() - ARCHIVE_DAYS * 86400000;
  for (const t of allTasks) {
    if (t.done && !t.archived && t.doneAt) {
      const doneTime = t.doneAt?.toDate ? t.doneAt.toDate().getTime() : new Date(t.doneAt).getTime();
      if (doneTime < cutoff) {
        try { await updateDoc(doc(db, COLLECTION, t.id), { archived: true }); } catch (e) {}
      }
    }
  }
}

// ==================== FIREBASE ====================
function subscribeToTasks() {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, COLLECTION));
  unsubscribe = onSnapshot(q, snapshot => {
    const all = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    allTasks = all.filter(t => !t.archived);
    archivedTasks = all.filter(t => t.archived);
    populateCategoryDatalist();
    renderWeek();
    renderProgress();
    setTimeout(autoArchive, 1000);
  }, err => {
    console.error('Ошибка:', err);
    showToast('Не удалось загрузить данные.', 'error');
  });
}

function populateCategoryDatalist() {
  const datalist = document.getElementById('category-list');
  const categories = [...new Set([...allTasks, ...archivedTasks].map(t => t.category).filter(Boolean))].sort();
  datalist.innerHTML = categories.map(c => `<option value="${c}">`).join('');
}

// ==================== DRAG & DROP ====================
function setupDragAndDrop() {
  const cards = document.querySelectorAll('.task-card');
  const columns = document.querySelectorAll('.day-column');

  cards.forEach(card => {
    card.setAttribute('draggable', 'true');

    card.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
      draggedTaskId = card.dataset.id;
      card.classList.add('dragging');
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
      document.querySelectorAll('.day-column').forEach(c => c.classList.remove('drag-over-column'));
      draggedTaskId = null;
    });

    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (card.dataset.id !== draggedTaskId) card.classList.add('drag-over');
    });

    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));

    card.addEventListener('drop', async e => {
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove('drag-over');
      const col = card.closest('.day-column');
      if (col) await handleDrop(card.dataset.id, col.dataset.date);
    });
  });

  columns.forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over-column');
    });

    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over-column');
    });

    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over-column');
      await handleDrop(null, col.dataset.date);
    });
  });
}

async function handleDrop(targetId, targetDate) {
  const sourceId = draggedTaskId;
  if (!sourceId) return;

  const all = [...allTasks, ...archivedTasks];
  const source = all.find(t => t.id === sourceId);
  if (!source || !targetDate) return;
  if (sourceId === targetId) return;

  const dateChanged = source.date !== targetDate;

  try {
    if (dateChanged) {
      await updateDoc(doc(db, COLLECTION, sourceId), {
        date: targetDate,
        updatedAt: serverTimestamp()
      });
      showToast('Задача перенесена', 'success');
    }

    const targetCol = document.querySelector(`.day-column[data-date="${targetDate}"]`);
    if (targetCol) {
      let ids = [...targetCol.querySelectorAll('.task-card')].map(c => c.dataset.id);
      ids = ids.filter(id => id !== sourceId);

      if (targetId) {
        const idx = ids.indexOf(targetId);
        if (idx >= 0) ids.splice(idx, 0, sourceId);
        else ids.push(sourceId);
      } else {
        ids.push(sourceId);
      }

      const updates = ids.map((id, i) =>
        updateDoc(doc(db, COLLECTION, id), { order: i })
      );
      await Promise.all(updates);
    }
  } catch (err) {
    console.error('Drop error:', err);
    showToast('Ошибка: ' + err.message, 'error');
  }
}

// ==================== РЕНДЕР ====================
function renderWeek() {
  const view = document.getElementById('weekView');
  const monthShort = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const dayNames = ['Понедельник','Вторник','Среда','Четверг','Пятница'];
  const todayStr = getTodayStr();

  const weekEnd = addDays(currentWeekStart, 4);
  const label = document.getElementById('weekLabel');
  const startDay = currentWeekStart.getDate();
  const endDay = weekEnd.getDate();
  const startMonth = monthShort[currentWeekStart.getMonth()];
  const endMonth = monthShort[weekEnd.getMonth()];
  const year = weekEnd.getFullYear();
  label.textContent = startMonth === endMonth
    ? `${startDay}–${endDay} ${startMonth} ${year}`
    : `${startDay} ${startMonth} – ${endDay} ${endMonth} ${year}`;

  const sourceTasks = showArchive ? archivedTasks : allTasks;

  let html = '';
  for (let i = 0; i < 5; i++) {
    const d = addDays(currentWeekStart, i);
    const dateStr = dateToStr(d);
    const isToday = dateStr === todayStr;

    let dayTasks = sourceTasks.filter(t => t.date === dateStr);
    if (!showDone && !showArchive) dayTasks = dayTasks.filter(t => !t.done);
    if (priorityFilter !== 'all') dayTasks = dayTasks.filter(t => t.priority === priorityFilter);
    if (searchQuery) {
      dayTasks = dayTasks.filter(t => {
        const haystack = [t.title, t.description, t.category].map(v => String(v == null ? '' : v).toLowerCase()).join(' ');
        return haystack.includes(searchQuery);
      });
    }

    const priorityOrder = { high: 0, medium: 1, low: 2 };
    dayTasks.sort((a, b) => {
      const ao = a.order ?? Number.MAX_SAFE_INTEGER;
      const bo = b.order ?? Number.MAX_SAFE_INTEGER;
      if (ao !== bo) return ao - bo;
      const at = a.time || '99:99';
      const bt = b.time || '99:99';
      if (at !== bt) return at.localeCompare(bt);
      return (priorityOrder[a.priority] ?? 3) - (priorityOrder[b.priority] ?? 3);
    });

    html += `
      <div class="day-column ${isToday ? 'today' : ''}" data-date="${dateStr}">
        <div class="day-header">
          <div class="day-header-info">
            <div class="day-name">${dayNames[i]}</div>
            <div class="day-date">${d.getDate()} ${monthShort[d.getMonth()]}</div>
          </div>
          <div class="day-count">${dayTasks.length}</div>
        </div>
        <div class="day-tasks">
          ${dayTasks.length === 0
            ? `<div class="empty-day">Свободный день</div>`
            : dayTasks.map(t => renderTaskCard(t, dateStr)).join('')}
        </div>
        ${!showArchive ? `<button class="add-task-btn" onclick="openAdd('${dateStr}')">+ Добавить</button>` : ''}
      </div>
    `;
  }

  view.innerHTML = html;
  setupDragAndDrop();
}

function renderTaskCard(t, dateStr) {
  const todayStr = getTodayStr();
  const isOverdue = t.date < todayStr && !t.done;
  const priorityClass = 'priority-' + (t.priority || 'low');

  const timePill = t.time ? `<span class="meta-pill time">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    ${esc(t.time)}</span>` : '';

  const catPill = t.category ? `<span class="meta-pill category">${esc(t.category)}</span>` : '';

  const remPill = (t.reminder && t.reminder !== '') ? `<span class="meta-pill reminder">🔔</span>` : '';

  return `
    <div class="task-card ${priorityClass} ${t.done ? 'done' : ''} ${isOverdue ? 'overdue' : ''}" data-id="${t.id}">
      <div class="task-card-actions">
        <button onclick="event.stopPropagation(); startEdit('${t.id}')" title="Редактировать">✏️</button>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteTask('${t.id}')" title="Удалить">🗑️</button>
      </div>
      <div class="task-card-top">
        <button class="task-checkbox" onclick="event.stopPropagation(); toggleDone('${t.id}', ${!t.done})" title="${t.done ? 'Отменить' : 'Выполнено'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <div class="task-card-title">${esc(t.title || '—')}</div>
      </div>
      <div class="task-card-meta">
        ${timePill}
        ${catPill}
        ${remPill}
      </div>
    </div>
  `;
}

function renderProgress() {
  const weekDates = [];
  for (let i = 0; i < 5; i++) weekDates.push(dateToStr(addDays(currentWeekStart, i)));

  const weekTasks = allTasks.filter(t => weekDates.includes(t.date));
  const done = weekTasks.filter(t => t.done).length;
  const total = weekTasks.length;
  const percent = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressFill').style.width = percent + '%';

  const notDone = weekTasks.filter(t => !t.done);
  document.getElementById('highCount').textContent = notDone.filter(t => t.priority === 'high').length;
  document.getElementById('mediumCount').textContent = notDone.filter(t => t.priority === 'medium').length;
  document.getElementById('lowCount').textContent = notDone.filter(t => t.priority === 'low').length;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ==================== МОДАЛЬНОЕ ОКНО ====================
const modalOverlay = document.getElementById('modalOverlay');

window.openAdd = (dateStr) => {
  editingId = null;
  document.getElementById('taskForm').reset();
  document.getElementById('date').value = dateStr || getTodayStr();
  document.getElementById('modalTitle').textContent = 'Новая задача';
  document.getElementById('submitBtn').textContent = 'Добавить';
  modalOverlay.classList.add('visible');
  setTimeout(() => document.getElementById('title').focus(), 100);
};

document.getElementById('fab').addEventListener('click', () => openAdd(getTodayStr()));
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('visible')) closeModal();
});

function closeModal() {
  modalOverlay.classList.remove('visible');
  editingId = null;
  document.getElementById('taskForm').reset();
}

// ==================== ДЕЙСТВИЯ ====================
window.toggleDone = async (id, done) => {
  try {
    const update = { done: !!done, updatedAt: serverTimestamp() };
    if (done) {
      update.doneAt = serverTimestamp();
      notifiedTaskIds.delete(id);
      localStorage.setItem('notified_task_ids', JSON.stringify([...notifiedTaskIds]));
    } else {
      update.doneAt = null;
      update.archived = false;
    }
    await updateDoc(doc(db, COLLECTION, id), update);
    if (done) showToast('Задача выполнена! 🎉', 'success');
  } catch (err) {
    console.error(err);
    showToast('Ошибка: ' + err.message, 'error');
  }
};

window.startEdit = (id) => {
  const t = [...allTasks, ...archivedTasks].find(x => x.id === id);
  if (!t) return;
  document.getElementById('title').value = t.title || '';
  document.getElementById('date').value = t.date || getTodayStr();
  document.getElementById('time').value = t.time || '';
  document.getElementById('priority').value = t.priority || 'low';
  document.getElementById('category').value = t.category || '';
  document.getElementById('description').value = t.description || '';
  document.getElementById('reminder').value = t.reminder || '';
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Редактирование';
  document.getElementById('submitBtn').textContent = 'Сохранить';
  modalOverlay.classList.add('visible');
  setTimeout(() => document.getElementById('title').focus(), 100);
};

window.deleteTask = async (id) => {
  if (!confirm('Удалить задачу?')) return;
  try {
    await deleteDoc(doc(db, COLLECTION, id));
    showToast('Задача удалена', 'info');
  } catch (err) {
    console.error(err);
    showToast('Ошибка: ' + err.message, 'error');
  }
};

// ==================== СОХРАНЕНИЕ ====================
document.getElementById('taskForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    title: document.getElementById('title').value.trim(),
    date: document.getElementById('date').value,
    time: document.getElementById('time').value || '',
    priority: document.getElementById('priority').value,
    category: document.getElementById('category').value.trim(),
    description: document.getElementById('description').value.trim(),
    reminder: document.getElementById('reminder').value,
    done: false
  };
  try {
    if (editingId) {
      data.updatedAt = serverTimestamp();
      await updateDoc(doc(db, COLLECTION, editingId), data);
      showToast('Задача обновлена', 'success');
      closeModal();
    } else {
      data.createdAt = serverTimestamp();
      data.order = Date.now();
      await addDoc(collection(db, COLLECTION), data);
      showToast('Задача добавлена', 'success');
      closeModal();
    }
  } catch (err) {
    console.error(err);
    showToast('Не удалось сохранить: ' + err.message, 'error');
  }
});

// ==================== НАВИГАЦИЯ С АНИМАЦИЕЙ ====================
function navigateWeek(direction) {
  if (direction === 'prev') currentWeekStart = addDays(currentWeekStart, -7);
  if (direction === 'next') currentWeekStart = addDays(currentWeekStart, 7);
  if (direction === 'today') currentWeekStart = getWeekStart(new Date());

  renderWeek();
  renderProgress();

  if (direction !== 'today') {
    const view = document.getElementById('weekView');
    view.classList.remove('animate-left', 'animate-right');
    void view.offsetWidth;
    view.classList.add(direction === 'next' ? 'animate-right' : 'animate-left');
    setTimeout(() => view.classList.remove('animate-left', 'animate-right'), 450);
  }
}

document.getElementById('prevWeek').addEventListener('click', () => navigateWeek('prev'));
document.getElementById('nextWeek').addEventListener('click', () => navigateWeek('next'));
document.getElementById('todayBtn').addEventListener('click', () => navigateWeek('today'));

// ==================== ФИЛЬТРЫ ====================
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', (e) => {
  const val = e.target.value;
  searchClear.classList.toggle('visible', val.length > 0);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = val.trim().toLowerCase();
    renderWeek();
  }, 250);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  renderWeek();
});

document.getElementById('priorityFilter').addEventListener('change', (e) => {
  priorityFilter = e.target.value;
  renderWeek();
});

document.getElementById('showDoneBtn').addEventListener('click', (e) => {
  showDone = !showDone;
  e.currentTarget.classList.toggle('active', showDone);
  renderWeek();
});
document.getElementById('showDoneBtn').classList.add('active');

document.getElementById('archiveBtn').addEventListener('click', (e) => {
  showArchive = !showArchive;
  e.currentTarget.classList.toggle('active', showArchive);
  renderWeek();
});

// ==================== ПЕЧАТЬ И ЭКСПОРТ ====================
document.getElementById('printBtn').addEventListener('click', () => window.print());

async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve(window.XLSX);
    script.onerror = () => reject(new Error('Не удалось загрузить Excel'));
    document.head.appendChild(script);
  });
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await loadXLSX();
    const weekDates = [];
    for (let i = 0; i < 5; i++) weekDates.push(dateToStr(addDays(currentWeekStart, i)));
    const source = showArchive ? archivedTasks : allTasks;
    const filtered = source.filter(t => weekDates.includes(t.date));
    if (filtered.length === 0) { showToast('Нет данных для экспорта', 'info'); return; }
    const aoa = [['Дата', 'Статус', 'Задача', 'Описание', 'Время', 'Приоритет', 'Категория']];
    filtered.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || '')).forEach(t => {
      aoa.push([
        t.date || '',
        t.done ? '✓' : '',
        t.title || '',
        t.description || '',
        t.time || '',
        t.priority === 'high' ? 'Высокий' : t.priority === 'medium' ? 'Средний' : 'Низкий',
        t.category || ''
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 32 }, { wch: 30 }, { wch: 8 }, { wch: 12 }, { wch: 16 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Неделя');
    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `planner_week_${dateStr}.xlsx`);
    showToast('Экспорт готов', 'success');
  } catch (err) {
    console.error(err);
    showToast('Ошибка экспорта: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
});

updateNotifBanner();
subscribeToTasks();
